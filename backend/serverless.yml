service: policypilotai-backend

package:
  individually: false
  patterns:
    - 'dist/**'
    - 'node_modules/**'
    - '!node_modules/.cache/**'
    - '!node_modules/.bin/**'
    - '!src/**'
    - '!**/*.ts'
    - '!**/*.map'
    - '!.env'
    - '!*.md'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1 # Change to your preferred region
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    REFRESH_TOKEN_SECRET: ${env:REFRESH_TOKEN_SECRET}
    JWT_EXPIRES_IN: 24h
    SMTP_HOST: smtp.gmail.com
    SMTP_PORT: "587"
    SMTP_USER: ${env:SMTP_USER}
    SMTP_PASS: ${env:SMTP_PASS}
    SMTP_FROM_NAME: PolicyPilotAI
    MONGO_FALLBACK: "false"
    ML_SERVICE_URL: ${env:ML_SERVICE_URL, "http://localhost:8001"}
    ML_TIMEOUT_MS: "8000"
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - Accept
        - Origin
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      allowCredentials: false

functions:
  api:
    handler: dist/backend/src/handler.handler
    events:
      - httpApi: '*' # Using HTTP API (v2) for lower cost and faster performance
